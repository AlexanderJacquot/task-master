[workspace]
resolver = "3"
members = ["crates/core", "crates/client", "crates/server", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
taskmaster-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
