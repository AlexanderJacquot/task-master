[package]
name = "taskmaster-outlook"
description = "Windows: the calendar of classic Outlook through its COM object model, as a calendar provider (ADR 030). Unsafe code only in its COM layer."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "taskmaster_outlook"

[dependencies]
taskmaster-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Already in the tree through Tauri (tao, webview2-com).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }
windows-core = "0.62.2"

# Not the workspace lints: those forbid unsafe code, and COM is reached through it here
# (ADR 030, as ADR 027 for AppKit). Every unsafe block states why it holds.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
