[package]
name = "taskmaster-core"
description = "Domain model, storage and commands for task-master. Every front end is an adapter over this crate."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "taskmaster_core"

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"], optional = true }
thiserror = "2"
uuid = { version = "1.29", features = ["v7"] }

[features]
specta = ["dep:specta"]
