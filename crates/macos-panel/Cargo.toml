[package]
name = "taskmaster-macos-panel"
description = "macOS: turns a Tauri window into a non-activating panel that shows over full-screen apps (ADR 027). The one crate of the workspace with unsafe code."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "taskmaster_macos_panel"

[dependencies]
tauri = { version = "2.12", default-features = false }

# Both crates are already in the tree through tao.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSPanel",
  "NSResponder",
  "NSWindow",
] }

# Not the workspace lints: those forbid unsafe code, and AppKit is reached through it here
# (ADR 027). Every unsafe block states why it holds.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
