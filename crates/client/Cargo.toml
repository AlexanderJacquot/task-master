[package]
name = "taskmaster-client"
description = "Blocking client for the task-master sync server (ADR 015): the desktop's sync worker, and later the MCP server in remote mode."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "taskmaster_client"

[lints]
workspace = true

[dependencies]
taskmaster-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.4.3"
base64 = "0.23.1"
sha2 = "0.11.1"
getrandom = "0.3.4"
url = "2.5"
# RRULE expansion and time zones for .ics and CalDAV events (ADR 037).
rrule = { version = "0.14", default-features = false }
roxmltree = "0.21"
chrono = "0.4"
chrono-tz = "0.10.4"

[dev-dependencies]
insta = "1.49"
