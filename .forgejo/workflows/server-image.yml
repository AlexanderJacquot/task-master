# Sync server image (ADR 015, docs/server.md), built on the homelab's Forgejo runner:
# the registry (harbor.solarnexus.space) is private, so the GitHub mirror cannot push to
# it. Same pattern as the other homelab apps (homelab repo, builds-ci).
#
# Needs the repo secret REGISTRY_TOKEN: a Forgejo token with package write.
# A v* tag pushes `<version>` and `latest`; Renovate in the homelab repo then bumps the
# deployed version.

name: server-image

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

env:
  IMAGE: harbor.solarnexus.space/knowledgesystem/task-master-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: harbor.solarnexus.space
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - id: tags
        run: |
          TAGS="${IMAGE}:latest"
          [ "${{ github.ref_type }}" = "tag" ] && TAGS="${IMAGE}:${{ github.ref_name }},${TAGS}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/server/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
