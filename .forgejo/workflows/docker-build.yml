# Pushing a vX.Y.Z tag builds deploy/Dockerfile (context: repo root) and pushes
# harbor.solarnexus.space/<owner>/<repo>:vX.Y.Z and :latest. Renovate in
# HomeLab/homelab picks up the new tag and opens the version bump PR there.

name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  REGISTRY: harbor.solarnexus.space
  DOCKERFILE: deploy/Dockerfile

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Dockerfile
        run: |
          if [ ! -f "${DOCKERFILE}" ]; then
            echo "::error::${DOCKERFILE} not found. Add one or change DOCKERFILE in this workflow."
            exit 1
          fi

      # Registry paths must be lowercase; Forgejo owners often are not (SmartHome).
      - name: Compute image name and tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          TAGS="${IMAGE}:latest"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${IMAGE}:${{ github.ref_name }},${TAGS}"
          fi
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.tags.outputs.image }}:buildcache,mode=max
