# Checks moved to GitHub: .github/workflows/ci.yml (ADR 010).
#
# This file stays on purpose. While `.forgejo/workflows` exists, Forgejo ignores
# `.github/workflows`; without it, Forgejo would run the GitHub release workflow too.
# It only runs when started by hand, and only says where the checks went.

name: ci (moved to GitHub)

on:
  workflow_dispatch:

jobs:
  moved:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI runs on the GitHub mirror (.github/workflows/ci.yml)."
