# Sync server image (ADR 015, ADR 016, docs/server.md). Runs on the GitHub mirror, like
# release.yml: Forgejo reads .forgejo/workflows and ignores this folder while that exists.
#
# A v* tag pushes ghcr.io/<owner>/task-master-server:<version> and :latest; Renovate in the
# homelab repo then bumps the deployed version. The package must be public (hosts pull
# without logging in): set it once in the package settings after its first push.
#
# Manual run: no input pushes `latest` from the chosen branch; `version: vX.Y.Z` rebuilds
# that existing tag and pushes only `<version>` (e.g. to republish a release).

name: server-image

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to rebuild (vX.Y.Z); empty pushes latest from the branch"
        required: false
        default: ""

concurrency:
  group: server-image-${{ inputs.version || github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
      - id: meta
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE="ghcr.io/${OWNER,,}/task-master-server"
          if [ -n "${VERSION}" ]; then
            [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: ${VERSION}" >&2; exit 1; }
            TAGS="${IMAGE}:${VERSION}"
          else
            TAGS="${IMAGE}:latest"
            [ "${{ github.ref_type }}" = "tag" ] && TAGS="${IMAGE}:${{ github.ref_name }},${TAGS}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Links the package to this repository on GHCR.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=task-master sync server
          cache-from: type=gha
          cache-to: type=gha,mode=max
