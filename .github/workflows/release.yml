# Installers for Linux, Windows and macOS (plan M6; ADR 001 and 007). Runs on the GitHub
# mirror only: Forgejo reads .forgejo/workflows and ignores this folder while that exists.
#
# Release: bump `version` in apps/desktop/src-tauri/tauri.conf.json, push a `v<version>`
# tag to Forgejo; the push mirror forwards it here and this builds and publishes the release.
# Installed apps update from it (ADR 009): update bundles are signed with the key in the
# TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) secrets and listed in latest.json. The installers
# themselves are not code-signed (Windows SmartScreen and macOS Gatekeeper warn once).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      # rustup reads the pinned toolchain from rust-toolchain.toml.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          if [ -n "${{ matrix.target }}" ]; then rustup target add "${{ matrix.target }}"; fi

      - uses: swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.platform }}-${{ matrix.target }}

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # `tauri.updater.conf.json` turns on the signed update bundles; tauri-action then
      # writes latest.json, which the app reads from releases/latest (ADR 009).
      # `tauri.sidecar.conf.json` builds the MCP server for the target and installs it next
      # to the app as `task-master-mcp` (ADR 017).
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: task-master ${{ github.ref_name }}
          releaseBody: |
            Lineage can be the place you work from: arrange cards in lanes by epic or project (drop a card into another lane to move it), pin cards so arranging leaves them alone, see each card's epic, remove a link with the × on its arrow, and link nearby tasks without searching. Lineage filters take several epics and tags, plus "No epic" and "No tag". Claude sessions under WSL find Claude Code installed in ~/.local/bin. task-master is now open source under the AGPL-3.0.

            No database changes (schema 12): 0.8.0 to 0.11.0 desktops and servers sync with each other. Server image: ghcr.io/alexanderjacquot/task-master-server:v0.11.0.

            Full release notes: https://github.com/AlexanderJacquot/task-master/blob/v0.11.0/docs/releases/0.11.0.md

            Installed apps (0.2.0 and later) pick this up from Settings → About.
            New install: Windows setup .exe, macOS .dmg; Linux .deb/.rpm, or the .AppImage elsewhere.
          releaseDraft: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json --config src-tauri/tauri.sidecar.conf.json

  # Arch Linux package task-master-bin (ADR 018), after the release is published: a failure
  # here leaves the installers and in-app updates untouched. Until the AUR_SSH_PRIVATE_KEY
  # secret exists (AUR registration is closed for now), this job builds and checks the
  # package, then fails on purpose at the publish step. Stable tags only: pkgver cannot
  # hold a pre-release suffix.
  aur:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
