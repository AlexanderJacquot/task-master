# Installers for Linux, Windows and macOS (plan M6; ADR 001 and 007). Runs on the GitHub
# mirror only: Forgejo reads .forgejo/workflows and ignores this folder while that exists.
#
# Release: bump `version` in apps/desktop/src-tauri/tauri.conf.json, push a `v<version>`
# tag to Forgejo; the push mirror forwards it here and this builds and publishes the release.
# Installed apps update from it (ADR 009): update bundles are signed with the key in the
# TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) secrets and listed in latest.json. The installers
# themselves are not code-signed (Windows SmartScreen and macOS Gatekeeper warn once).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      # rustup reads the pinned toolchain from rust-toolchain.toml.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          if [ -n "${{ matrix.target }}" ]; then rustup target add "${{ matrix.target }}"; fi

      - uses: swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.platform }}-${{ matrix.target }}

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # `tauri.updater.conf.json` turns on the signed update bundles; tauri-action then
      # writes latest.json, which the app reads from releases/latest (ADR 009).
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: task-master ${{ github.ref_name }}
          releaseBody: |
            Sync tasks and attachments across devices with a self-hosted server from Settings → Sync.
            Includes offline editing, merge or backed-up replacement, token/OIDC sign-in, task metrics and stale indicators.

            Google Calendar continues to run on one desktop. Server Calendar execution, the HTTP API, CLI and MCP are not included.

            Installed apps (0.2.0 and later) pick this up from Settings → About and updates.
            New install: Windows setup .exe, macOS .dmg, Linux .AppImage or .deb/.rpm.
          releaseDraft: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
