# Installers for Linux, Windows and macOS (plan M6; ADR 001 and 007). Runs on the GitHub
# mirror only: Forgejo reads .forgejo/workflows and ignores this folder while that exists.
#
# Release: bump `version` in apps/desktop/src-tauri/tauri.conf.json, push a `v<version>`
# tag to Forgejo; the push mirror forwards it here and this builds and publishes the release.
# Installed apps update from it (ADR 009): update bundles are signed with the key in the
# TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) secrets and listed in latest.json. The installers
# themselves are not code-signed (Windows SmartScreen and macOS Gatekeeper warn once).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      # rustup reads the pinned toolchain from rust-toolchain.toml.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          if [ -n "${{ matrix.target }}" ]; then rustup target add "${{ matrix.target }}"; fi

      - uses: swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.platform }}-${{ matrix.target }}

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # `tauri.updater.conf.json` turns on the signed update bundles; tauri-action then
      # writes latest.json, which the app reads from releases/latest (ADR 009).
      # `tauri.sidecar.conf.json` builds the MCP server for the target and installs it next
      # to the app as `task-master-mcp` (ADR 017).
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: task-master ${{ github.ref_name }}
          releaseBody: |
            Send tasks to an agent from the desktop, follow its progress, and resume the conversation. Agent sessions include a bundled MCP server, separate agent-owned tasks, and a Review status for finished work awaiting your approval.
            Also: a freeform Lineage canvas, medieval icons, settings categories, clearer subtask and agent indicators, and fixes for board selection clipping and terminal session handling.

            Update the sync server and all desktops to 0.7.0 together: this release upgrades the database to schema 11. Server image: ghcr.io/alexanderjacquot/task-master-server:v0.7.0.

            Full release notes: https://github.com/AlexanderJacquot/task-master/blob/v0.7.0/docs/releases/0.7.0.md

            Installed apps (0.2.0 and later) pick this up from Settings → About.
            New install: Windows setup .exe, macOS .dmg; Linux .deb/.rpm, task-master-bin from the AUR on Arch, or the .AppImage elsewhere.
          releaseDraft: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json --config src-tauri/tauri.sidecar.conf.json

  # Arch Linux package task-master-bin (ADR 018): repackages the .deb this release just
  # published, so the app runs on the system WebKitGTK instead of the AppImage's bundled one.
  # Builds, installs and checks the package, then pushes PKGBUILD and .SRCINFO to the AUR
  # when the AUR_SSH_PRIVATE_KEY secret is set (docs/release.md). Stable tags only: pkgver
  # cannot hold a pre-release suffix.
  aur:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git openssh

      - uses: actions/checkout@v6.1.0

      - name: Point the PKGBUILD at this release
        run: |
          version="${GITHUB_REF_NAME#v}"
          deb="task-master_${version}_amd64.deb"
          curl -fsSL -o "/tmp/$deb" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$deb"
          sum=$(sha256sum "/tmp/$deb" | cut -d' ' -f1)
          sed -i -e "s/^pkgver=.*/pkgver=${version}/" -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${sum}')/" packaging/aur/PKGBUILD

      # makepkg refuses to run as root. Installing with the real dependencies and checking
      # that every library resolves catches a dependency the PKGBUILD does not list yet.
      - name: Build, install and check the package
        run: |
          useradd -m builder
          chown -R builder packaging/aur
          cd packaging/aur
          su builder -c 'makepkg --printsrcinfo > .SRCINFO && makepkg -f --noconfirm --nodeps'
          pacman -U --noconfirm task-master-bin-*.pkg.tar.zst
          test -s /usr/share/task-master/managed-by
          for bin in /usr/bin/taskmaster-desktop /usr/bin/task-master-mcp; do
            if ldd "$bin" | grep 'not found'; then echo "::error::$bin has missing libraries"; exit 1; fi
          done

      - name: Publish to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set: the package was built and checked, not published."
            exit 0
          fi
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/task-master-bin.git /tmp/aur
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO /tmp/aur/
          cd /tmp/aur
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "The AUR already has this version."; exit 0; fi
          git commit -m "Update to ${GITHUB_REF_NAME#v}"
          git push origin HEAD:master
