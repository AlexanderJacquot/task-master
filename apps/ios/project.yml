# The Xcode project is generated from this file with XcodeGen and never edited or checked
# in (ADR 040): `scripts/ios/generate-project.sh`. Change settings here, not in Xcode: its
# "Update to recommended settings" edits are lost at the next generation.
name: TaskMaster
options:
  bundleIdPrefix: space.solarnexus
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # The Xcode the settings below were brought up to (its LastUpgradeCheck).
  xcodeVersion: "27.2"
packages:
  TaskMasterKit:
    path: TaskMasterKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.14.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # The Rust library has an arm64 simulator slice only (Apple silicon).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    ALWAYS_SEARCH_USER_PATHS: "NO"
    # What a new Xcode 27.2 project has beyond XcodeGen's presets.
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    GCC_C_LANGUAGE_STANDARD: gnu17
    # Enhanced Security: the hardened-process protections (entitlements on the app) and
    # the compiler-side hardening. Pointer authentication (an arm64e slice) stays off
    # everywhere: the Rust library and TaskMasterKit are built for arm64 only, and the UI
    # test bundle must match its arm64 runner. Turn it on once the XCFramework has arm64e.
    ENABLE_ENHANCED_SECURITY: "YES"
    ENABLE_POINTER_AUTHENTICATION: "NO"
targets:
  TaskMaster:
    type: application
    platform: iOS
    # Shared: the App Intents, also compiled into the widgets (their buttons run them).
    # Assets.xcassets: the app icon (scripts/ios/generate-app-icon.sh).
    sources: [App, Shared, Assets.xcassets]
    dependencies:
      - package: TaskMasterKit
      - target: TaskMasterWidgets
      - target: TaskMasterShare
    # The data folder is in this group's container, shared with the extensions
    # (SharedStore). Simulator builds sign locally; a device needs the group registered.
    entitlements:
      path: build/App.entitlements
      properties:
        com.apple.security.application-groups: [group.space.solarnexus.taskmaster]
        # Enhanced Security, version 2: hardened allocator, read-only dyld state, dyld and
        # Mach message restrictions. Hardware memory tagging (A19 and later) is not on.
        com.apple.security.hardened-process: true
        com.apple.security.hardened-process.enhanced-security-version-string: "2"
        com.apple.security.hardened-process.hardened-heap: true
        com.apple.security.hardened-process.dyld-ro: true
        com.apple.security.hardened-process.platform-restrictions-string: "2"
    info:
      path: build/App-Info.plist
      properties:
        CFBundleDisplayName: Task Master
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Plain http is allowed only to this machine and the local network (a server on
        # the LAN, and the test server in CI); anything else needs https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # taskmaster:// links: notifications, widgets, Spotlight (AppLink), and the
        # identity provider's sign-in coming back (taskmaster://oidc/callback).
        CFBundleURLTypes:
          - CFBundleURLName: space.solarnexus.taskmaster
            CFBundleURLSchemes: [taskmaster]
        # Background app refresh: a sync round now and then (BackgroundSync).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [space.solarnexus.taskmaster.sync]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.solarnexus.taskmaster
        PRODUCT_NAME: TaskMaster
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TaskMasterWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: TaskMasterKit
    entitlements:
      path: build/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.space.solarnexus.taskmaster]
    info:
      path: build/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Task Master
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.solarnexus.taskmaster.widgets
        PRODUCT_NAME: TaskMasterWidgets
  TaskMasterShare:
    type: app-extension
    platform: iOS
    sources: [Share]
    dependencies:
      - package: TaskMasterKit
    entitlements:
      path: build/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.space.solarnexus.taskmaster]
    info:
      path: build/Share-Info.plist
      properties:
        CFBundleDisplayName: Task Master
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 5
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.solarnexus.taskmaster.share
        PRODUCT_NAME: TaskMasterShare
  TaskMasterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TaskMaster
    info:
      path: build/UITests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.solarnexus.taskmaster.uitests
        # Xcode 27 leaves it empty otherwise ("-Runner.app/PlugIns/.xctest").
        PRODUCT_NAME: TaskMasterUITests
        TEST_TARGET_NAME: TaskMaster
schemes:
  TaskMaster:
    build:
      targets:
        TaskMaster: all
        TaskMasterUITests: [test]
    test:
      targets: [TaskMasterUITests]
