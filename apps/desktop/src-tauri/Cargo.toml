[package]
name = "taskmaster-desktop"
description = "task-master desktop shell: thin Tauri adapter over taskmaster-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "taskmaster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
taskmaster-core = { workspace = true, features = ["specta"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.0"
# Remote backup to an S3-compatible store (Garage): request signing + a small HTTP client.
rusty-s3 = "0.10.2"
ureq = "3.4.3"
url = "2.5"
serde_json = "1"
# Release candidates: pinned exactly (plan, section 10 risks).
specta = "=2.0.0-rc.26"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "=0.0.13"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
